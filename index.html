<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Custom AI Camera Trainer</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;
            text-align: center;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 15px;
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        video {
            width: 100%;
            max-width: 400px;
            height: 300px;
            object-fit: cover;
            border: 2px solid #444;
            border-radius: 8px;
            background: #000;
        }

        .controls {
            margin-top: 15px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .class-group {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #2c2c2c;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 12px;
            font-size: 15px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            color: #fff;
            width: 100%;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        #status {
            font-size: 0.95rem;
            margin: 12px 0;
            color: #ff9800;
            font-weight: bold;
            padding: 0 5px;
            word-break: break-word;
        }

        #prediction {
            font-size: 1.2rem;
            color: #4CAF50;
            margin-top: 15px;
            font-weight: bold;
            background: #1e1e1e;
            padding: 12px;
            border-radius: 6px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>


    <!-- ================================================ -->
    <!-- AI LIBRARIES                                    -->
    <!-- ================================================ -->

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <!-- MobileNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

    <!-- KNN Classifier -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.6/dist/knn-classifier.min.js"></script>

</head>

<body>

    <h2>Custom AI Camera Trainer</h2>

    <div id="status">
        Initializing system...
    </div>


    <!-- CAMERA -->

    <div class="video-container">

        <video
            id="webcam"
            autoplay
            playsinline
            muted>
        </video>

    </div>


    <!-- CONTROLS -->

    <div class="controls">

        <div style="margin-bottom: 12px;">

            <button
                id="toggle-camera"
                style="background:#607D8B;">
                Switch to Rear Camera
            </button>

        </div>


        <!-- OBJECT A -->

        <div class="class-group">

            <input
                type="text"
                id="name-0"
                value="Object A">

            <button
                id="btn-0"
                disabled
                style="background:#008ba3;">

                Add Sample:
                <span id="label-text-0">
                    Object A
                </span>

            </button>

            <span
                id="count-0"
                style="color:#aaa;font-size:0.9rem;">

                0 samples

            </span>

        </div>


        <!-- OBJECT B -->

        <div class="class-group">

            <input
                type="text"
                id="name-1"
                value="Object B">

            <button
                id="btn-1"
                disabled
                style="background:#008ba3;">

                Add Sample:
                <span id="label-text-1">
                    Object B
                </span>

            </button>

            <span
                id="count-1"
                style="color:#aaa;font-size:0.9rem;">

                0 samples

            </span>

        </div>


        <!-- START / RESET -->

        <div class="action-row">

            <button
                id="train"
                disabled
                style="background:#4CAF50;">
                Start Predicting
            </button>

            <button
                id="reset"
                style="background:#f44336;">
                Reset
            </button>

        </div>

    </div>


    <!-- PREDICTION -->

    <div id="prediction">
        Prediction: Model not ready
    </div>



<script>

    // ==================================================
    // ELEMENTS
    // ==================================================

    const video = document.getElementById("webcam");

    const statusDiv =
        document.getElementById("status");

    const predictionDiv =
        document.getElementById("prediction");

    const toggleCamBtn =
        document.getElementById("toggle-camera");

    const btn0 =
        document.getElementById("btn-0");

    const btn1 =
        document.getElementById("btn-1");

    const trainBtn =
        document.getElementById("train");

    const resetBtn =
        document.getElementById("reset");

    const nameInput0 =
        document.getElementById("name-0");

    const nameInput1 =
        document.getElementById("name-1");

    const labelText0 =
        document.getElementById("label-text-0");

    const labelText1 =
        document.getElementById("label-text-1");

    const count0Span =
        document.getElementById("count-0");

    const count1Span =
        document.getElementById("count-1");


    // ==================================================
    // VARIABLES
    // ==================================================

    let classifier = null;

    let mobilenetModel = null;

    let isPredicting = false;

    let useRearCamera = false;

    let predictionFrame = null;

    let sampleCounts = {
        0: 0,
        1: 0
    };


    // ==================================================
    // UPDATE CLASS NAMES
    // ==================================================

    nameInput0.addEventListener("input", function () {

        labelText0.innerText =
            nameInput0.value.trim() || "Class 1";

    });


    nameInput1.addEventListener("input", function () {

        labelText1.innerText =
            nameInput1.value.trim() || "Class 2";

    });



    // ==================================================
    // CHECK LIBRARIES
    // ==================================================

    function checkLibraries() {

        if (typeof tf === "undefined") {

            throw new Error(
                "TensorFlow.js failed to load."
            );

        }


        if (typeof mobilenet === "undefined") {

            throw new Error(
                "MobileNet failed to load."
            );

        }


        if (typeof knnClassifier === "undefined") {

            throw new Error(
                "KNN Classifier failed to load."
            );

        }


        console.log(
            "TensorFlow.js version:",
            tf.version.tfjs
        );

        console.log(
            "MobileNet library:",
            typeof mobilenet
        );

        console.log(
            "KNN Classifier library:",
            typeof knnClassifier
        );

    }



    // ==================================================
    // CAMERA SETUP
    // ==================================================

    async function setupCamera() {

        statusDiv.innerText =
            "Starting camera...";


        // Stop old camera if running

        if (video.srcObject) {

            video.srcObject
                .getTracks()
                .forEach(function (track) {

                    track.stop();

                });

            video.srcObject = null;

        }


        // Camera settings

        const constraints = {

            video: {

                facingMode: useRearCamera
                    ? { ideal: "environment" }
                    : { ideal: "user" },

                width: {
                    ideal: 640
                },

                height: {
                    ideal: 480
                }

            },

            audio: false

        };


        try {

            const stream =
                await navigator.mediaDevices.getUserMedia(
                    constraints
                );


            video.srcObject = stream;


            await new Promise(function (resolve) {

                video.onloadedmetadata =
                    function () {

                        resolve();

                    };

            });


            await video.play();


            return true;

        }

        catch (error) {

            console.warn(
                "Preferred camera failed:",
                error
            );


            // Try default camera

            try {

                statusDiv.innerText =
                    "Trying default camera...";


                const fallbackStream =
                    await navigator.mediaDevices.getUserMedia({

                        video: true,
                        audio: false

                    });


                video.srcObject =
                    fallbackStream;


                await new Promise(function (resolve) {

                    video.onloadedmetadata =
                        function () {

                            resolve();

                        };

                });


                await video.play();


                return true;

            }

            catch (fallbackError) {

                console.error(
                    "Camera failed:",
                    fallbackError
                );


                throw new Error(
                    "Camera access failed. Please allow camera permission."
                );

            }

        }

    }



    // ==================================================
    // INITIALIZE SYSTEM
    // ==================================================

    async function init() {

        try {

            statusDiv.innerText =
                "Checking AI libraries...";


            // Check TensorFlow / MobileNet / KNN

            checkLibraries();


            statusDiv.innerText =
                "Preparing TensorFlow...";


            // Wait for TensorFlow backend

            await tf.ready();


            console.log(
                "TensorFlow backend:",
                tf.getBackend()
            );


            statusDiv.innerText =
                "Loading MobileNet AI model...";


            // Create KNN classifier

            classifier =
                knnClassifier.create();


            // Load MobileNet

            mobilenetModel =
                await mobilenet.load();


            console.log(
                "MobileNet model loaded successfully."
            );


            statusDiv.innerText =
                "Requesting camera permission...";


            // Camera is started AFTER AI libraries load.

            await setupCamera();


            statusDiv.innerText =
                "Ready! Point the camera at an object and add samples.";


            btn0.disabled = false;

            btn1.disabled = false;

            trainBtn.disabled = false;

        }

        catch (error) {

            console.error(
                "Initialization Error:",
                error
            );


            statusDiv.innerText =
                "Initialization Error: " +
                error.message;

        }

    }



    // ==================================================
    // ADD TRAINING SAMPLE
    // ==================================================

    function addExample(classId) {

        if (!mobilenetModel ||
            !classifier) {

            statusDiv.innerText =
                "AI model is not ready.";

            return;

        }


        if (video.readyState < 2) {

            statusDiv.innerText =
                "Camera is not ready yet.";

            return;

        }


        let activation = null;


        try {

            activation =
                mobilenetModel.infer(
                    video,
                    "conv_preds"
                );


            classifier.addExample(
                activation,
                classId
            );


            sampleCounts[classId]++;


            // Update sample counter

            if (classId === 0) {

                count0Span.innerText =
                    sampleCounts[0] +
                    (
                        sampleCounts[0] === 1
                            ? " sample"
                            : " samples"
                    );

            }

            else {

                count1Span.innerText =
                    sampleCounts[1] +
                    (
                        sampleCounts[1] === 1
                            ? " sample"
                            : " samples"
                    );

            }


            // Get current customised class name

            const currentName =
                classId === 0
                    ? (
                        nameInput0.value.trim() ||
                        "Class 1"
                    )
                    : (
                        nameInput1.value.trim() ||
                        "Class 2"
                    );


            statusDiv.innerText =
                'Added sample for "' +
                currentName +
                '". Total classes: ' +
                classifier.getNumClasses();


        }

        catch (error) {

            console.error(
                "Add Sample Error:",
                error
            );


            statusDiv.innerText =
                "Unable to add sample: " +
                error.message;

        }

        finally {

            // classifier.addExample() keeps its own
            // representation of the example.
            // Dispose our temporary activation.

            if (activation) {

                activation.dispose();

            }

        }

    }



    // ==================================================
    // START / STOP PREDICTION
    // ==================================================

    function togglePrediction() {

        if (!classifier) {

            statusDiv.innerText =
                "Classifier is not ready.";

            return;

        }


        if (
            classifier.getNumClasses() === 0
        ) {

            alert(
                "Please add training samples first!"
            );

            return;

        }


        // STOP prediction

        if (isPredicting) {

            isPredicting = false;


            trainBtn.innerText =
                "Start Predicting";


            statusDiv.innerText =
                "Prediction stopped.";


            if (predictionFrame !== null) {

                cancelAnimationFrame(
                    predictionFrame
                );

                predictionFrame = null;

            }


            return;

        }


        // START prediction

        isPredicting = true;


        trainBtn.innerText =
            "Stop Predicting";


        statusDiv.innerText =
            "AI is running live prediction...";


        runPredictionLoop();

    }



    // ==================================================
    // PREDICTION LOOP
    // ==================================================

    async function runPredictionLoop() {

        if (!isPredicting) {

            return;

        }


        let activation = null;


        try {

            if (
                !classifier ||
                classifier.getNumClasses() === 0
            ) {

                isPredicting = false;

                trainBtn.innerText =
                    "Start Predicting";

                return;

            }


            if (video.readyState < 2) {

                predictionFrame =
                    requestAnimationFrame(
                        runPredictionLoop
                    );

                return;

            }


            // Get MobileNet feature vector

            activation =
                mobilenetModel.infer(
                    video,
                    "conv_preds"
                );


            // Ask KNN classifier

            const result =
                await classifier.predictClass(
                    activation
                );


            // result.label can be a string.
            // Convert it to number.

            const predictedClass =
                Number(result.label);


            let className = "Unknown";


            if (predictedClass === 0) {

                className =
                    nameInput0.value.trim() ||
                    "Class 1";

            }

            else if (predictedClass === 1) {

                className =
                    nameInput1.value.trim() ||
                    "Class 2";

            }


            // Read confidence

            const rawConfidence =
                result.confidences[
                    result.label
                ] ?? 0;


            const confidence =
                Math.round(
                    rawConfidence * 100
                );


            predictionDiv.innerText =
                "Prediction: " +
                className +
                " (" +
                confidence +
                "%)";

        }

        catch (error) {

            console.error(
                "Prediction Error:",
                error
            );


            isPredicting = false;


            trainBtn.innerText =
                "Start Predicting";


            statusDiv.innerText =
                "Prediction Error: " +
                error.message;


            return;

        }

        finally {

            // Prevent tensor memory buildup

            if (activation) {

                activation.dispose();

            }

        }


        if (isPredicting) {

            predictionFrame =
                requestAnimationFrame(
                    runPredictionLoop
                );

        }

    }



    // ==================================================
    // RESET TRAINING
    // ==================================================

    function resetModel() {

        // Stop prediction first

        isPredicting = false;


        if (predictionFrame !== null) {

            cancelAnimationFrame(
                predictionFrame
            );

            predictionFrame = null;

        }


        // Clear KNN classes

        if (classifier) {

            classifier.clearAllClasses();

        }


        sampleCounts = {

            0: 0,
            1: 0

        };


        count0Span.innerText =
            "0 samples";


        count1Span.innerText =
            "0 samples";


        trainBtn.innerText =
            "Start Predicting";


        predictionDiv.innerText =
            "Prediction: Model not ready";


        statusDiv.innerText =
            "Model cleared. Add new samples.";

    }



    // ==================================================
    // SWITCH CAMERA
    // ==================================================

    async function switchCamera() {

        try {

            // Temporarily stop prediction

            const wasPredicting =
                isPredicting;


            isPredicting = false;


            if (predictionFrame !== null) {

                cancelAnimationFrame(
                    predictionFrame
                );

                predictionFrame = null;

            }


            useRearCamera =
                !useRearCamera;


            toggleCamBtn.innerText =
                useRearCamera
                    ? "Switch to Front Camera"
                    : "Switch to Rear Camera";


            await setupCamera();


            statusDiv.innerText =
                useRearCamera
                    ? "Rear camera active."
                    : "Front camera active.";


            // Resume prediction

            if (
                wasPredicting &&
                classifier &&
                classifier.getNumClasses() > 0
            ) {

                isPredicting = true;

                trainBtn.innerText =
                    "Stop Predicting";

                runPredictionLoop();

            }

        }

        catch (error) {

            console.error(
                "Camera Switching Error:",
                error
            );


            statusDiv.innerText =
                "Camera Switching Error: " +
                error.message;

        }

    }



    // ==================================================
    // BUTTON EVENTS
    // ==================================================

    btn0.addEventListener(
        "click",
        function () {

            addExample(0);

        }
    );


    btn1.addEventListener(
        "click",
        function () {

            addExample(1);

        }
    );


    trainBtn.addEventListener(
        "click",
        togglePrediction
    );


    resetBtn.addEventListener(
        "click",
        resetModel
    );


    toggleCamBtn.addEventListener(
        "click",
        switchCamera
    );



    // ==================================================
    // START APP
    // ==================================================

    window.addEventListener(
        "load",
        init
    );



    // ==================================================
    // CLEAN UP CAMERA WHEN LEAVING PAGE
    // ==================================================

    window.addEventListener(
        "beforeunload",
        function () {

            isPredicting = false;


            if (predictionFrame !== null) {

                cancelAnimationFrame(
                    predictionFrame
                );

            }


            if (video.srcObject) {

                video.srcObject
                    .getTracks()
                    .forEach(function (track) {

                        track.stop();

                    });

            }


            if (classifier) {

                classifier.clearAllClasses();

            }

        }
    );

</script>

</body>
</html>
