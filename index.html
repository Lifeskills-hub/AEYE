<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Custom AI Camera Trainer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        h2 {
            font-size: 1.35rem;
            margin: 5px 0 10px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
        }

        .video-container {
            width: 100%;
            margin: 0 auto;
        }

        video {
            display: block;
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #000000;
            border: 2px solid #444444;
            border-radius: 8px;
        }

        #status {
            color: #ff9800;
            font-size: 0.95rem;
            font-weight: bold;
            margin: 12px 0;
            padding: 0 5px;
            word-break: break-word;
        }

        #prediction {
            color: #4caf50;
            background: #1e1e1e;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px;
            margin-top: 15px;
            border-radius: 7px;
            word-break: break-word;
        }

        .controls {
            margin-top: 15px;
        }

        .settings-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 12px;
            text-align: left;
        }

        .settings-title {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .threshold-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #threshold {
            flex: 1;
        }

        #threshold-value {
            color: #00bcd4;
            font-weight: bold;
            min-width: 45px;
            text-align: right;
        }

        .threshold-note {
            color: #aaaaaa;
            font-size: 0.82rem;
            line-height: 1.4;
            margin-top: 8px;
        }

        #classes-container {
            margin-top: 12px;
        }

        .class-group {
            background: #1e1e1e;
            padding: 11px;
            border-radius: 7px;
            margin-bottom: 10px;
        }

        .class-heading {
            color: #bbbbbb;
            font-size: 0.82rem;
            text-align: left;
            margin-bottom: 7px;
        }

        .class-name {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            color: #ffffff;
            background: #2c2c2c;
            border: 1px solid #555555;
            border-radius: 4px;
        }

        .sample-button {
            background: #008ba3;
            margin-top: 8px;
        }

        .class-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
        }

        .sample-count {
            color: #aaaaaa;
            font-size: 0.88rem;
            text-align: left;
        }

        .remove-button {
            width: auto;
            padding: 7px 10px;
            background: #6d4c41;
            font-size: 0.82rem;
        }

        button {
            width: 100%;
            padding: 12px;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .camera-button {
            background: #607d8b;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        #predict {
            background: #4caf50;
        }

        #reset {
            background: #f44336;
        }

        .add-class-button {
            background: #6a1b9a;
            margin-top: 2px;
        }

        .small-note {
            color: #999999;
            font-size: 0.8rem;
            line-height: 1.4;
            margin: 10px 4px 0;
        }

        @media (max-width: 380px) {
            video {
                height: 260px;
            }

            .action-row {
                flex-direction: column;
            }
        }
    </style>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <!-- MobileNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

    <!-- KNN Classifier -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.6/dist/knn-classifier.min.js"></script>
</head>

<body>

    <div class="container">

        <h2>Custom AI Camera Trainer</h2>

        <div id="status">
            Initializing system...
        </div>

        <div class="video-container">
            <video
                id="webcam"
                autoplay
                playsinline
                muted
            ></video>
        </div>

        <div class="controls">

            <button
                id="toggle-camera"
                class="camera-button"
                type="button"
            >
                Switch to Rear Camera
            </button>

            <div class="settings-box">

                <label
                    class="settings-title"
                    for="threshold"
                >
                    Recognition Threshold
                </label>

                <div class="threshold-row">

                    <input
                        id="threshold"
                        type="range"
                        min="50"
                        max="99"
                        value="75"
                        step="1"
                    >

                    <span id="threshold-value">
                        75%
                    </span>

                </div>

                <div class="threshold-note">
                    Results below this confidence level will be shown as
                    “Unrecognized Item”.
                </div>

            </div>

            <div id="classes-container"></div>

            <button
                id="add-class"
                class="add-class-button"
                type="button"
            >
                + Add Another Item
            </button>

            <div class="action-row">

                <button
                    id="predict"
                    type="button"
                    disabled
                >
                    Start Predicting
                </button>

                <button
                    id="reset"
                    type="button"
                >
                    Reset All
                </button>

            </div>

            <div class="small-note">
                For better results, collect at least 10 to 20 samples for
                each item from different angles and distances.
            </div>

        </div>

        <div id="prediction">
            Prediction: Model not ready
        </div>

    </div>


    <script>
        "use strict";

        // =====================================================
        // PAGE ELEMENTS
        // =====================================================

        const video =
            document.getElementById("webcam");

        const statusDiv =
            document.getElementById("status");

        const predictionDiv =
            document.getElementById("prediction");

        const classesContainer =
            document.getElementById("classes-container");

        const toggleCameraButton =
            document.getElementById("toggle-camera");

        const addClassButton =
            document.getElementById("add-class");

        const predictButton =
            document.getElementById("predict");

        const resetButton =
            document.getElementById("reset");

        const thresholdSlider =
            document.getElementById("threshold");

        const thresholdValue =
            document.getElementById("threshold-value");


        // =====================================================
        // APPLICATION STATE
        // =====================================================

        let classifier = null;
        let mobilenetModel = null;

        let useRearCamera = false;
        let isPredicting = false;
        let predictionFrame = null;

        let nextClassId = 0;

        /*
            Each entry uses:

            classId: numeric ID supplied to KNN
            element: HTML class panel
            input: item name input
            button: Add Sample button
            countElement: sample counter
            sampleCount: number of collected samples
        */
        const classRecords = new Map();


        // =====================================================
        // SETTINGS
        // =====================================================

        function getConfidenceThreshold() {
            return Number(thresholdSlider.value) / 100;
        }


        thresholdSlider.addEventListener("input", function () {
            thresholdValue.textContent =
                thresholdSlider.value + "%";
        });


        // =====================================================
        // LIBRARY CHECK
        // =====================================================

        function checkLibraries() {
            if (typeof tf === "undefined") {
                throw new Error(
                    "TensorFlow.js failed to load."
                );
            }

            if (typeof mobilenet === "undefined") {
                throw new Error(
                    "MobileNet failed to load."
                );
            }

            if (typeof knnClassifier === "undefined") {
                throw new Error(
                    "KNN Classifier failed to load."
                );
            }

            console.log(
                "TensorFlow.js version:",
                tf.version.tfjs
            );
        }


        // =====================================================
        // CAMERA
        // =====================================================

        function stopCurrentCamera() {
            if (!video.srcObject) {
                return;
            }

            video.srcObject
                .getTracks()
                .forEach(function (track) {
                    track.stop();
                });

            video.srcObject = null;
        }


        async function attachCameraStream(stream) {
            video.srcObject = stream;

            await new Promise(function (resolve) {
                video.onloadedmetadata = function () {
                    resolve();
                };
            });

            await video.play();
        }


        async function setupCamera() {
            stopCurrentCamera();

            const preferredConstraints = {
                video: {
                    facingMode: useRearCamera
                        ? { ideal: "environment" }
                        : { ideal: "user" },

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 480
                    }
                },

                audio: false
            };

            try {
                const stream =
                    await navigator.mediaDevices.getUserMedia(
                        preferredConstraints
                    );

                await attachCameraStream(stream);
            } catch (preferredError) {
                console.warn(
                    "Preferred camera failed:",
                    preferredError
                );

                const fallbackStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                await attachCameraStream(fallbackStream);
            }
        }


        async function switchCamera() {
            const wasPredicting = isPredicting;

            stopPrediction(false);

            useRearCamera = !useRearCamera;

            toggleCameraButton.textContent =
                useRearCamera
                    ? "Switch to Front Camera"
                    : "Switch to Rear Camera";

            try {
                statusDiv.textContent =
                    "Switching camera...";

                await setupCamera();

                statusDiv.textContent =
                    (useRearCamera ? "Rear" : "Front") +
                    " camera active. AI ready.";

                if (
                    wasPredicting &&
                    classifier &&
                    classifier.getNumClasses() > 0
                ) {
                    startPrediction();
                }
            } catch (error) {
                console.error(
                    "Camera switching error:",
                    error
                );

                statusDiv.textContent =
                    "Camera Error: " +
                    error.message;
            }
        }


        // =====================================================
        // DYNAMIC ITEM CLASSES
        // =====================================================

        function getDefaultClassName(classId) {
            return "Item " + (classId + 1);
        }


        function getClassName(classId) {
            const record =
                classRecords.get(classId);

            if (!record) {
                return "Unknown Item";
            }

            return (
                record.input.value.trim() ||
                getDefaultClassName(classId)
            );
        }


        function createClassPanel() {
            const classId = nextClassId;
            nextClassId++;

            const panel =
                document.createElement("div");

            panel.className = "class-group";
            panel.dataset.classId = String(classId);

            const heading =
                document.createElement("div");

            heading.className = "class-heading";
            heading.textContent =
                "Training item " + (classId + 1);


            const input =
                document.createElement("input");

            input.type = "text";
            input.className = "class-name";
            input.value = getDefaultClassName(classId);
            input.placeholder = "Enter item name";
            input.setAttribute(
                "aria-label",
                "Name for item " + (classId + 1)
            );


            const sampleButton =
                document.createElement("button");

            sampleButton.type = "button";
            sampleButton.className = "sample-button";
            sampleButton.disabled =
                !mobilenetModel || !classifier;


            const buttonLabel =
                document.createElement("span");

            buttonLabel.textContent =
                input.value;

            sampleButton.append(
                document.createTextNode("Add Sample: "),
                buttonLabel
            );


            const footer =
                document.createElement("div");

            footer.className = "class-footer";


            const countElement =
                document.createElement("span");

            countElement.className = "sample-count";
            countElement.textContent = "0 samples";


            const removeButton =
                document.createElement("button");

            removeButton.type = "button";
            removeButton.className = "remove-button";
            removeButton.textContent = "Remove";


            footer.append(
                countElement,
                removeButton
            );


            panel.append(
                heading,
                input,
                sampleButton,
                footer
            );


            classesContainer.appendChild(panel);


            const record = {
                classId: classId,
                element: panel,
                input: input,
                button: sampleButton,
                buttonLabel: buttonLabel,
                countElement: countElement,
                sampleCount: 0
            };


            classRecords.set(
                classId,
                record
            );


            input.addEventListener("input", function () {
                buttonLabel.textContent =
                    input.value.trim() ||
                    getDefaultClassName(classId);
            });


            sampleButton.addEventListener(
                "click",
                function () {
                    addExample(classId);
                }
            );


            removeButton.addEventListener(
                "click",
                function () {
                    removeClass(classId);
                }
            );


            return record;
        }


        function enableClassButtons() {
            classRecords.forEach(function (record) {
                record.button.disabled =
                    !mobilenetModel || !classifier;
            });

            predictButton.disabled =
                !mobilenetModel || !classifier;
        }


        function addEmptyClassIfNeeded(classId) {
            const record =
                classRecords.get(classId);

            if (!record || record.sampleCount !== 1) {
                return;
            }

            const records =
                Array.from(classRecords.values());

            const lastRecord =
                records[records.length - 1];

            /*
                Add a new empty item after the first sample
                is collected for the latest item.
            */
            if (
                lastRecord &&
                lastRecord.classId === classId
            ) {
                createClassPanel();

                statusDiv.textContent =
                    'First sample added for "' +
                    getClassName(classId) +
                    '". A new item has been created below.';
            }
        }


        function removeClass(classId) {
            const record =
                classRecords.get(classId);

            if (!record) {
                return;
            }

            const wasPredicting =
                isPredicting;

            stopPrediction(false);

            /*
                Clear only this class from KNN.
                clearClass() is available in the KNN classifier.
            */
            try {
                if (
                    classifier &&
                    record.sampleCount > 0
                ) {
                    classifier.clearClass(classId);
                }
            } catch (error) {
                console.warn(
                    "Unable to clear individual class:",
                    error
                );
            }

            record.element.remove();
            classRecords.delete(classId);

            statusDiv.textContent =
                "Item removed.";

            if (classRecords.size === 0) {
                createClassPanel();
            }

            const hasEmptyClass =
                Array.from(classRecords.values())
                    .some(function (item) {
                        return item.sampleCount === 0;
                    });

            if (!hasEmptyClass) {
                createClassPanel();
            }

            if (
                wasPredicting &&
                classifier &&
                classifier.getNumClasses() > 0
            ) {
                startPrediction();
            }
        }


        // =====================================================
        // ADD TRAINING SAMPLE
        // =====================================================

        function addExample(classId) {
            const record =
                classRecords.get(classId);

            if (!record) {
                return;
            }

            if (!mobilenetModel || !classifier) {
                statusDiv.textContent =
                    "AI model is not ready.";
                return;
            }

            if (video.readyState < 2) {
                statusDiv.textContent =
                    "Camera is not ready yet.";
                return;
            }

            let activation = null;

            try {
                activation =
                    mobilenetModel.infer(
                        video,
                        "conv_preds"
                    );

                classifier.addExample(
                    activation,
                    classId
                );

                record.sampleCount++;

                record.countElement.textContent =
                    record.sampleCount +
                    (
                        record.sampleCount === 1
                            ? " sample"
                            : " samples"
                    );

                const className =
                    getClassName(classId);

                statusDiv.textContent =
                    'Added sample for "' +
                    className +
                    '". Total: ' +
                    record.sampleCount +
                    ".";

                addEmptyClassIfNeeded(classId);
            } catch (error) {
                console.error(
                    "Add sample error:",
                    error
                );

                statusDiv.textContent =
                    "Unable to add sample: " +
                    error.message;
            } finally {
                if (activation) {
                    activation.dispose();
                }
            }
        }


        // =====================================================
        // PREDICTION
        // =====================================================

        function startPrediction() {
            if (!classifier) {
                statusDiv.textContent =
                    "Classifier is not ready.";
                return;
            }

            if (classifier.getNumClasses() === 0) {
                alert(
                    "Please add training samples first."
                );
                return;
            }

            if (isPredicting) {
                return;
            }

            isPredicting = true;

            predictButton.textContent =
                "Stop Predicting";

            statusDiv.textContent =
                "AI is running live prediction...";

            runPredictionLoop();
        }


        function stopPrediction(showStatus = true) {
            isPredicting = false;

            predictButton.textContent =
                "Start Predicting";

            if (predictionFrame !== null) {
                cancelAnimationFrame(
                    predictionFrame
                );

                predictionFrame = null;
            }

            if (showStatus) {
                statusDiv.textContent =
                    "Prediction stopped.";
            }
        }


        function togglePrediction() {
            if (isPredicting) {
                stopPrediction(true);
            } else {
                startPrediction();
            }
        }


        async function runPredictionLoop() {
            if (!isPredicting) {
                return;
            }

            let activation = null;

            try {
                if (
                    !classifier ||
                    classifier.getNumClasses() === 0
                ) {
                    stopPrediction(false);

                    predictionDiv.textContent =
                        "Prediction: Model not ready";

                    return;
                }

                if (video.readyState < 2) {
                    predictionFrame =
                        requestAnimationFrame(
                            runPredictionLoop
                        );

                    return;
                }

                activation =
                    mobilenetModel.infer(
                        video,
                        "conv_preds"
                    );

                const result =
                    await classifier.predictClass(
                        activation
                    );

                const predictedClassId =
                    Number(result.label);

                const confidenceValue =
                    Number(
                        result.confidences[
                            result.label
                        ] || 0
                    );

                const confidencePercent =
                    Math.round(
                        confidenceValue * 100
                    );

                const threshold =
                    getConfidenceThreshold();

                const record =
                    classRecords.get(
                        predictedClassId
                    );

                /*
                    Show Unrecognized Item when:

                    1. Confidence is below the selected threshold, or
                    2. The predicted class no longer exists in the UI.
                */
                if (
                    confidenceValue < threshold ||
                    !record
                ) {
                    predictionDiv.textContent =
                        "Prediction: Unrecognized Item (" +
                        confidencePercent +
                        "%)";

                    predictionDiv.style.color =
                        "#ff9800";
                } else {
                    predictionDiv.textContent =
                        "Prediction: " +
                        getClassName(predictedClassId) +
                        " (" +
                        confidencePercent +
                        "%)";

                    predictionDiv.style.color =
                        "#4caf50";
                }
            } catch (error) {
                console.error(
                    "Prediction error:",
                    error
                );

                stopPrediction(false);

                statusDiv.textContent =
                    "Prediction Error: " +
                    error.message;

                return;
            } finally {
                if (activation) {
                    activation.dispose();
                }
            }

            if (isPredicting) {
                predictionFrame =
                    requestAnimationFrame(
                        runPredictionLoop
                    );
            }
        }


        // =====================================================
        // RESET
        // =====================================================

        function resetAll() {
            stopPrediction(false);

            if (classifier) {
                classifier.clearAllClasses();
            }

            classRecords.forEach(function (record) {
                record.element.remove();
            });

            classRecords.clear();
            nextClassId = 0;

            createClassPanel();
            enableClassButtons();

            predictionDiv.textContent =
                "Prediction: Model not ready";

            predictionDiv.style.color =
                "#4caf50";

            statusDiv.textContent =
                "All training samples cleared.";
        }


        // =====================================================
        // INITIALIZATION
        // =====================================================

        async function initializeApp() {
            try {
                statusDiv.textContent =
                    "Checking AI libraries...";

                checkLibraries();

                statusDiv.textContent =
                    "Preparing TensorFlow...";

                await tf.ready();

                console.log(
                    "TensorFlow backend:",
                    tf.getBackend()
                );

                classifier =
                    knnClassifier.create();

                statusDiv.textContent =
                    "Loading MobileNet model...";

                mobilenetModel =
                    await mobilenet.load();

                statusDiv.textContent =
                    "Requesting camera permission...";

                await setupCamera();

                enableClassButtons();

                statusDiv.textContent =
                    "Ready! Name an item and add training samples.";
            } catch (error) {
                console.error(
                    "Initialization error:",
                    error
                );

                statusDiv.textContent =
                    "Initialization Error: " +
                    error.message;
            }
        }


        // =====================================================
        // EVENTS
        // =====================================================

        addClassButton.addEventListener(
            "click",
            function () {
                const newRecord =
                    createClassPanel();

                newRecord.input.focus();

                statusDiv.textContent =
                    "New training item added.";
            }
        );


        toggleCameraButton.addEventListener(
            "click",
            switchCamera
        );


        predictButton.addEventListener(
            "click",
            togglePrediction
        );


        resetButton.addEventListener(
            "click",
            resetAll
        );


        window.addEventListener(
            "load",
            function () {
                /*
                    Begin with one item. Another item will
                    appear after its first sample is added.
                */
                createClassPanel();
                initializeApp();
            }
        );


        window.addEventListener(
            "beforeunload",
            function () {
                stopPrediction(false);
                stopCurrentCamera();

                if (classifier) {
                    classifier.clearAllClasses();
                }
            }
        );
    </script>

</body>
</html>
