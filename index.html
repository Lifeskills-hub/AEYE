<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom AI Camera Trainer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 15px; }
        h2 { font-size: 1.3rem; margin-bottom: 10px; }
        .video-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
        video { width: 100%; max-width: 400px; height: 300px; object-fit: cover; border: 2px solid #444; border-radius: 8px; background: #000; }
        .controls { margin-top: 15px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .class-group { background: #1e1e1e; padding: 10px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        input[type="text"] { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #555; background: #2c2c2c; color: #fff; width: 100%; box-sizing: border-box; }
        button { padding: 12px; font-size: 15px; cursor: pointer; background: #00bcd4; border: none; border-radius: 4px; font-weight: bold; color: #fff; width: 100%; }
        button:active { opacity: 0.8; }
        #status { font-size: 0.95rem; margin: 12px 0; color: #ff9800; font-weight: bold; padding: 0 5px; word-break: break-word; }
        #prediction { font-size: 1.2rem; color: #4CAF50; margin-top: 15px; font-weight: bold; background: #1e1e1e; padding: 12px; border-radius: 6px; max-width: 400px; margin-left: auto; margin-right: auto; }
        .action-row { display: flex; gap: 10px; margin-top: 10px; }
    </style>

    <!-- Reliable CDNJS Links -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/3.11.0/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.3/dist/knn-classifier.min.js"></script>
</head>
<body>

    <h2>Custom AI Camera Trainer</h2>
    <div id="status">Initializing system...</div>

    <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="controls">
        <div style="margin-bottom: 12px;">
            <button id="toggle-camera" style="background: #607D8B;">Switch to Rear Camera</button>
        </div>

        <div class="class-group">
            <input type="text" id="name-0" value="Object A">
            <button id="btn-0" disabled style="background: #008ba3;">Add Sample: <span id="label-text-0">Object A</span></button>
            <span id="count-0" style="color: #aaa; font-size: 0.9rem;">0 samples</span>
        </div>

        <div class="class-group">
            <input type="text" id="name-1" value="Object B">
            <button id="btn-1" disabled style="background: #008ba3;">Add Sample: <span id="label-text-1">Object B</span></button>
            <span id="count-1" style="color: #aaa; font-size: 0.9rem;">0 samples</span>
        </div>

        <div class="action-row">
            <button id="train" style="background: #4CAF50;" disabled>Start Predicting</button>
            <button id="reset" style="background: #f44336;">Reset</button>
        </div>
    </div>

    <div id="prediction">Prediction: Model not ready</div>

    <script>
        const video = document.getElementById('webcam');
        const statusDiv = document.getElementById('status');
        const predictionDiv = document.getElementById('prediction');
        const toggleCamBtn = document.getElementById('toggle-camera');

        const btn0 = document.getElementById('btn-0');
        const btn1 = document.getElementById('btn-1');
        const trainBtn = document.getElementById('train');

        const nameInput0 = document.getElementById('name-0');
        const nameInput1 = document.getElementById('name-1');
        const labelText0 = document.getElementById('label-text-0');
        const labelText1 = document.getElementById('label-text-1');
        const count0Span = document.getElementById('count-0');
        const count1Span = document.getElementById('count-1');

        let classifier = null;
        let mobilenetModel = null;
        let isPredicting = false;
        let useRearCamera = false;
        let sampleCounts = { 0: 0, 1: 0 };

        nameInput0.addEventListener('input', () => { labelText0.innerText = nameInput0.value || "Class 1"; });
        nameInput1.addEventListener('input', () => { labelText1.innerText = nameInput1.value || "Class 2"; });

        async function setupCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useRearCamera ? { exact: "environment" } : "user",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }
            };

            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadedmetadata = () => { resolve(video); };
                });
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = fallbackStream;
                } catch (fallbackErr) {
                    statusDiv.innerText = "Camera Error: Please allow permissions in browser settings.";
                    throw fallbackErr;
                }
            }
        }

        async function init() {
            try {
                statusDiv.innerText = "Requesting camera permissions...";
                await setupCamera();

                statusDiv.innerText = "Loading AI models...";

                // Brief pause to ensure global script execution context is fully bound
                await new Promise(resolve => setTimeout(resolve, 500));

                if (typeof tf === 'undefined' || typeof mobilenet === 'undefined' || typeof knnClassifier === 'undefined') {
                    throw new Error("Libraries failed to register globally.");
                }

                classifier = knnClassifier.create();
                mobilenetModel = await mobilenet.load();
                
                statusDiv.innerText = "Ready! Type names, point camera, and add samples.";
                
                btn0.removeAttribute('disabled');
                btn1.removeAttribute('disabled');
                trainBtn.removeAttribute('disabled');

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Initialization Error: " + err.message;
            }

            btn0.addEventListener('click', () => addExample(0));
            btn1.addEventListener('click', () => addExample(1));
            trainBtn.addEventListener('click', startPredicting);
            document.getElementById('reset').addEventListener('click', resetModel);
            
            toggleCamBtn.addEventListener('click', async () => {
                useRearCamera = !useRearCamera;
                toggleCamBtn.innerText = useRearCamera ? "Switch to Front Camera" : "Switch to Rear Camera";
                await setupCamera();
            });
        }

        function addExample(classId) {
            if (!mobilenetModel) return;
            const activation = mobilenetModel.infer(video, "conv_preds");
            classifier.addExample(activation, classId);
            
            sampleCounts[classId]++;
            if (classId === 0) {
                count0Span.innerText = `${sampleCounts[0]} samples`;
            } else {
                count1Span.innerText = `${sampleCounts[1]} samples`;
            }

            const currentName = classId === 0 ? nameInput0.value : nameInput1.value;
            statusDiv.innerText = `Added sample for "${currentName}". Total classes: ${classifier.getNumClasses()}`;
        }

        async function startPredicting() {
            if (classifier.getNumClasses() === 0) {
                alert("Please add training samples first!");
                return;
            }
            isPredicting = true;
            statusDiv.innerText = "AI is running live prediction...";
            runPredictionLoop();
        }

        async function runPredictionLoop() {
            if (!isPredicting) return;

            const activation = mobilenetModel.infer(video, "conv_preds");
            const result = await classifier.predictClass(activation);

            const className = result.label === 0 ? nameInput0.value : nameInput1.value;
            const confidence = Math.round(result.confidences[result.label] * 100);

            predictionDiv.innerText = `Prediction: ${className} (${confidence}%)`;

            requestAnimationFrame(runPredictionLoop);
        }

        function resetModel() {
            isPredicting = false;
            if (classifier) classifier.clearAllClasses();
            sampleCounts = { 0: 0, 1: 0 };
            count0Span.innerText = "0 samples";
            count1Span.innerText = "0 samples";
            statusDiv.innerText = "Model cleared. Start fresh.";
            predictionDiv.innerText = "Prediction: Model not ready";
        }

        window.onload = init;
    </script>

</body>
</html>
