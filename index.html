<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Custom AI Camera Trainer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            text-align: center;
            background: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
        }

        h2 {
            font-size: 1.35rem;
            margin: 5px 0 10px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
        }

        #status {
            color: #ff9800;
            font-size: 0.95rem;
            font-weight: bold;
            margin: 12px 0;
            padding: 0 5px;
            word-break: break-word;
        }

        .video-container {
            position: relative;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            border: 2px solid #444444;
            border-radius: 8px;
            background: #000000;
        }

        video {
            display: block;
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: #000000;
        }

        #prediction-overlay {
            display: none;
            position: absolute;
            left: 12px;
            right: 12px;
            bottom: 12px;
            padding: 12px 14px;
            border-radius: 8px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.72);
            border: 2px solid #4caf50;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1.3;
            word-break: break-word;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
        }

        #prediction-overlay.recognized {
            display: block;
            color: #ffffff;
            border-color: #4caf50;
            background: rgba(20, 90, 25, 0.78);
        }

        #prediction-overlay.unrecognized {
            display: block;
            color: #ffffff;
            border-color: #ff9800;
            background: rgba(125, 70, 0, 0.82);
        }

        .overlay-name {
            display: block;
            font-size: 1.25rem;
        }

        .overlay-confidence {
            display: block;
            font-size: 0.85rem;
            margin-top: 3px;
            opacity: 0.9;
        }

        .controls {
            margin-top: 15px;
        }

        .settings-box {
            background: #1e1e1e;
            padding: 12px;
            border-radius: 7px;
            margin: 12px 0;
            text-align: left;
        }

        .settings-title {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .threshold-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #threshold {
            flex: 1;
        }

        #threshold-value {
            color: #00bcd4;
            font-weight: bold;
            min-width: 45px;
            text-align: right;
        }

        .threshold-note {
            color: #aaaaaa;
            font-size: 0.82rem;
            line-height: 1.4;
            margin-top: 8px;
        }

        #classes-container {
            margin-top: 12px;
        }

        .class-group {
            background: #1e1e1e;
            padding: 11px;
            border-radius: 7px;
            margin-bottom: 10px;
        }

        .class-heading {
            color: #bbbbbb;
            font-size: 0.82rem;
            text-align: left;
            margin-bottom: 7px;
        }

        .class-name {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            color: #ffffff;
            background: #2c2c2c;
            border: 1px solid #555555;
            border-radius: 4px;
        }

        .sample-button {
            background: #008ba3;
            margin-top: 8px;
        }

        .class-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
        }

        .sample-count {
            color: #aaaaaa;
            font-size: 0.88rem;
            text-align: left;
        }

        .remove-button {
            width: auto;
            padding: 7px 10px;
            background: #6d4c41;
            font-size: 0.82rem;
        }

        button {
            width: 100%;
            padding: 12px;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        button:active {
            opacity: 0.8;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .camera-button {
            background: #607d8b;
        }

        .add-class-button {
            background: #6a1b9a;
            margin-top: 2px;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        #predict {
            background: #4caf50;
        }

        #reset {
            background: #f44336;
        }

        .data-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        #save-training {
            background: #1565c0;
        }

        #load-training {
            background: #ef6c00;
        }

        #training-file {
            display: none;
        }

        .small-note {
            color: #999999;
            font-size: 0.8rem;
            line-height: 1.4;
            margin: 10px 4px 0;
        }

        @media (max-width: 380px) {
            video {
                height: 260px;
            }

            .action-row,
            .data-row {
                flex-direction: column;
            }
        }
    </style>

    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

    <!-- MobileNet -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>

    <!-- KNN Classifier -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier@1.2.6/dist/knn-classifier.min.js"></script>
</head>

<body>

    <div class="container">

        <h2>Custom AI Camera Trainer</h2>

        <div id="status">
            Initializing system...
        </div>

        <div class="video-container">

            <video
                id="webcam"
                autoplay
                playsinline
                muted
            ></video>

            <div
                id="prediction-overlay"
                role="status"
                aria-live="polite"
            >
                <span
                    id="overlay-name"
                    class="overlay-name"
                >
                    Waiting for prediction
                </span>

                <span
                    id="overlay-confidence"
                    class="overlay-confidence"
                ></span>
            </div>

        </div>

        <div class="controls">

            <button
                id="toggle-camera"
                class="camera-button"
                type="button"
            >
                Switch to Rear Camera
            </button>

            <div class="settings-box">

                <label
                    class="settings-title"
                    for="threshold"
                >
                    Recognition Threshold
                </label>

                <div class="threshold-row">

                    <input
                        id="threshold"
                        type="range"
                        min="50"
                        max="99"
                        value="75"
                        step="1"
                    >

                    <span id="threshold-value">
                        75%
                    </span>

                </div>

                <div class="threshold-note">
                    Predictions below this confidence level will display
                    “Unrecognized Item”.
                </div>

            </div>

            <div id="classes-container"></div>

            <button
                id="add-class"
                class="add-class-button"
                type="button"
            >
                + Add Another Item
            </button>

            <div class="action-row">

                <button
                    id="predict"
                    type="button"
                    disabled
                >
                    Start Predicting
                </button>

                <button
                    id="reset"
                    type="button"
                >
                    Reset All
                </button>

            </div>

            <div class="data-row">

                <button
                    id="save-training"
                    type="button"
                    disabled
                >
                    Save Training Data
                </button>

                <button
                    id="load-training"
                    type="button"
                    disabled
                >
                    Load Training Data
                </button>

            </div>

            <input
                id="training-file"
                type="file"
                accept=".json,application/json"
            >

            <div class="small-note">
                Save Training Data downloads a JSON file containing the
                trained feature vectors, item names and threshold. It does
                not save or upload camera photos.
            </div>

        </div>

    </div>


    <script>
        "use strict";

        // =====================================================
        // PAGE ELEMENTS
        // =====================================================

        const video =
            document.getElementById("webcam");

        const statusDiv =
            document.getElementById("status");

        const predictionOverlay =
            document.getElementById("prediction-overlay");

        const overlayName =
            document.getElementById("overlay-name");

        const overlayConfidence =
            document.getElementById("overlay-confidence");

        const classesContainer =
            document.getElementById("classes-container");

        const toggleCameraButton =
            document.getElementById("toggle-camera");

        const addClassButton =
            document.getElementById("add-class");

        const predictButton =
            document.getElementById("predict");

        const resetButton =
            document.getElementById("reset");

        const saveTrainingButton =
            document.getElementById("save-training");

        const loadTrainingButton =
            document.getElementById("load-training");

        const trainingFileInput =
            document.getElementById("training-file");

        const thresholdSlider =
            document.getElementById("threshold");

        const thresholdValue =
            document.getElementById("threshold-value");


        // =====================================================
        // APPLICATION STATE
        // =====================================================

        let classifier = null;
        let mobilenetModel = null;

        let useRearCamera = false;
        let isPredicting = false;
        let predictionFrame = null;

        let nextClassId = 0;

        const classRecords = new Map();


        // =====================================================
        // THRESHOLD
        // =====================================================

        function getConfidenceThreshold() {
            return Number(thresholdSlider.value) / 100;
        }


        thresholdSlider.addEventListener(
            "input",
            function () {
                thresholdValue.textContent =
                    thresholdSlider.value + "%";
            }
        );


        // =====================================================
        // LIBRARY CHECK
        // =====================================================

        function checkLibraries() {
            if (typeof tf === "undefined") {
                throw new Error(
                    "TensorFlow.js failed to load."
                );
            }

            if (typeof mobilenet === "undefined") {
                throw new Error(
                    "MobileNet failed to load."
                );
            }

            if (typeof knnClassifier === "undefined") {
                throw new Error(
                    "KNN Classifier failed to load."
                );
            }

            console.log(
                "TensorFlow.js version:",
                tf.version.tfjs
            );
        }


        // =====================================================
        // CAMERA
        // =====================================================

        function stopCurrentCamera() {
            if (!video.srcObject) {
                return;
            }

            video.srcObject
                .getTracks()
                .forEach(function (track) {
                    track.stop();
                });

            video.srcObject = null;
        }


        async function attachCameraStream(stream) {
            video.srcObject = stream;

            await new Promise(function (resolve) {
                video.onloadedmetadata = function () {
                    resolve();
                };
            });

            await video.play();
        }


        async function setupCamera() {
            stopCurrentCamera();

            const preferredConstraints = {
                video: {
                    facingMode: useRearCamera
                        ? { ideal: "environment" }
                        : { ideal: "user" },

                    width: {
                        ideal: 640
                    },

                    height: {
                        ideal: 480
                    }
                },

                audio: false
            };

            try {
                const stream =
                    await navigator.mediaDevices.getUserMedia(
                        preferredConstraints
                    );

                await attachCameraStream(stream);
            } catch (preferredError) {
                console.warn(
                    "Preferred camera failed:",
                    preferredError
                );

                const fallbackStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                await attachCameraStream(
                    fallbackStream
                );
            }
        }


        async function switchCamera() {
            const wasPredicting = isPredicting;

            stopPrediction(false);

            useRearCamera = !useRearCamera;

            toggleCameraButton.textContent =
                useRearCamera
                    ? "Switch to Front Camera"
                    : "Switch to Rear Camera";

            try {
                statusDiv.textContent =
                    "Switching camera...";

                await setupCamera();

                statusDiv.textContent =
                    (useRearCamera ? "Rear" : "Front") +
                    " camera active. AI ready.";

                if (
                    wasPredicting &&
                    classifier &&
                    classifier.getNumClasses() > 0
                ) {
                    startPrediction();
                }
            } catch (error) {
                console.error(
                    "Camera switching error:",
                    error
                );

                statusDiv.textContent =
                    "Camera Error: " +
                    error.message;
            }
        }


        // =====================================================
        // DYNAMIC ITEM CLASSES
        // =====================================================

        function getDefaultClassName(classId) {
            return "Item " + (classId + 1);
        }


        function getClassName(classId) {
            const record =
                classRecords.get(classId);

            if (!record) {
                return "Unknown Item";
            }

            return (
                record.input.value.trim() ||
                getDefaultClassName(classId)
            );
        }


        function formatSampleCount(count) {
            return (
                count +
                (count === 1 ? " sample" : " samples")
            );
        }


        function createClassPanel(
            requestedClassId = null,
            requestedName = null,
            requestedCount = 0
        ) {
            let classId;

            if (
                requestedClassId !== null &&
                Number.isInteger(Number(requestedClassId))
            ) {
                classId =
                    Number(requestedClassId);

                nextClassId =
                    Math.max(
                        nextClassId,
                        classId + 1
                    );
            } else {
                classId = nextClassId;
                nextClassId++;
            }

            const panel =
                document.createElement("div");

            panel.className = "class-group";
            panel.dataset.classId = String(classId);


            const heading =
                document.createElement("div");

            heading.className = "class-heading";
            heading.textContent =
                "Training item " + (classId + 1);


            const input =
                document.createElement("input");

            input.type = "text";
            input.className = "class-name";
            input.value =
                requestedName ||
                getDefaultClassName(classId);

            input.placeholder = "Enter item name";

            input.setAttribute(
                "aria-label",
                "Name for item " + (classId + 1)
            );


            const sampleButton =
                document.createElement("button");

            sampleButton.type = "button";
            sampleButton.className = "sample-button";

            sampleButton.disabled =
                !mobilenetModel || !classifier;


            const buttonLabel =
                document.createElement("span");

            buttonLabel.textContent =
                input.value;


            sampleButton.append(
                document.createTextNode(
                    "Add Sample: "
                ),
                buttonLabel
            );


            const footer =
                document.createElement("div");

            footer.className = "class-footer";


            const countElement =
                document.createElement("span");

            countElement.className =
                "sample-count";

            countElement.textContent =
                formatSampleCount(
                    Number(requestedCount) || 0
                );


            const removeButton =
                document.createElement("button");

            removeButton.type = "button";
            removeButton.className =
                "remove-button";

            removeButton.textContent =
                "Remove";


            footer.append(
                countElement,
                removeButton
            );


            panel.append(
                heading,
                input,
                sampleButton,
                footer
            );


            classesContainer.appendChild(
                panel
            );


            const record = {
                classId: classId,
                element: panel,
                input: input,
                button: sampleButton,
                buttonLabel: buttonLabel,
                countElement: countElement,
                sampleCount:
                    Number(requestedCount) || 0
            };


            classRecords.set(
                classId,
                record
            );


            input.addEventListener(
                "input",
                function () {
                    buttonLabel.textContent =
                        input.value.trim() ||
                        getDefaultClassName(
                            classId
                        );
                }
            );


            sampleButton.addEventListener(
                "click",
                function () {
                    addExample(classId);
                }
            );


            removeButton.addEventListener(
                "click",
                function () {
                    removeClass(classId);
                }
            );


            return record;
        }


        function enableControls() {
            const ready =
                Boolean(
                    mobilenetModel &&
                    classifier
                );

            classRecords.forEach(
                function (record) {
                    record.button.disabled =
                        !ready;
                }
            );

            predictButton.disabled =
                !ready;

            loadTrainingButton.disabled =
                !ready;

            updateSaveButton();
        }


        function updateSaveButton() {
            const canSave =
                Boolean(
                    classifier &&
                    classifier.getNumClasses() > 0
                );

            saveTrainingButton.disabled =
                !canSave;
        }


        function ensureEmptyClassExists() {
            const hasEmptyClass =
                Array.from(
                    classRecords.values()
                ).some(function (record) {
                    return record.sampleCount === 0;
                });

            if (!hasEmptyClass) {
                createClassPanel();
            }
        }


        function addEmptyClassIfNeeded(classId) {
            const record =
                classRecords.get(classId);

            if (
                !record ||
                record.sampleCount !== 1
            ) {
                return;
            }

            const records =
                Array.from(
                    classRecords.values()
                );

            const lastRecord =
                records[records.length - 1];

            if (
                lastRecord &&
                lastRecord.classId === classId
            ) {
                createClassPanel();

                statusDiv.textContent =
                    'First sample added for "' +
                    getClassName(classId) +
                    '". A new item has been created below.';
            }
        }


        function removeClass(classId) {
            const record =
                classRecords.get(classId);

            if (!record) {
                return;
            }

            stopPrediction(false);

            try {
                if (
                    classifier &&
                    record.sampleCount > 0
                ) {
                    classifier.clearClass(
                        classId
                    );
                }
            } catch (error) {
                console.warn(
                    "Unable to clear class:",
                    error
                );
            }

            record.element.remove();
            classRecords.delete(classId);

            if (classRecords.size === 0) {
                createClassPanel();
            }

            ensureEmptyClassExists();
            updateSaveButton();

            hidePredictionOverlay();

            statusDiv.textContent =
                "Item removed.";
        }


        function clearClassPanels() {
            classRecords.forEach(
                function (record) {
                    record.element.remove();
                }
            );

            classRecords.clear();
            nextClassId = 0;
        }


        // =====================================================
        // ADD TRAINING SAMPLE
        // =====================================================

        function addExample(classId) {
            const record =
                classRecords.get(classId);

            if (!record) {
                return;
            }

            if (
                !mobilenetModel ||
                !classifier
            ) {
                statusDiv.textContent =
                    "AI model is not ready.";

                return;
            }

            if (video.readyState < 2) {
                statusDiv.textContent =
                    "Camera is not ready yet.";

                return;
            }

            let activation = null;

            try {
                activation =
                    mobilenetModel.infer(
                        video,
                        "conv_preds"
                    );

                classifier.addExample(
                    activation,
                    classId
                );

                record.sampleCount++;

                record.countElement.textContent =
                    formatSampleCount(
                        record.sampleCount
                    );

                statusDiv.textContent =
                    'Added sample for "' +
                    getClassName(classId) +
                    '". Total: ' +
                    record.sampleCount +
                    ".";

                addEmptyClassIfNeeded(
                    classId
                );

                updateSaveButton();
            } catch (error) {
                console.error(
                    "Add sample error:",
                    error
                );

                statusDiv.textContent =
                    "Unable to add sample: " +
                    error.message;
            } finally {
                /*
                    addExample stores its own tensor data
                    inside the KNN dataset.
                */
                if (activation) {
                    activation.dispose();
                }
            }
        }


        // =====================================================
        // PREDICTION OVERLAY
        // =====================================================

        function showRecognizedOverlay(
            itemName,
            confidencePercent
        ) {
            predictionOverlay.className =
                "recognized";

            overlayName.textContent =
                itemName;

            overlayConfidence.textContent =
                confidencePercent +
                "% confidence";
        }


        function showUnrecognizedOverlay(
            confidencePercent
        ) {
            predictionOverlay.className =
                "unrecognized";

            overlayName.textContent =
                "Unrecognized Item";

            overlayConfidence.textContent =
                "Best match: " +
                confidencePercent +
                "%";
        }


        function showWaitingOverlay() {
            predictionOverlay.className =
                "unrecognized";

            overlayName.textContent =
                "Analysing camera...";

            overlayConfidence.textContent =
                "";
        }


        function hidePredictionOverlay() {
            predictionOverlay.className = "";

            overlayName.textContent =
                "Waiting for prediction";

            overlayConfidence.textContent =
                "";
        }


        // =====================================================
        // PREDICTION
        // =====================================================

        function startPrediction() {
            if (!classifier) {
                statusDiv.textContent =
                    "Classifier is not ready.";

                return;
            }

            if (
                classifier.getNumClasses() === 0
            ) {
                alert(
                    "Please add or load training samples first."
                );

                return;
            }

            if (isPredicting) {
                return;
            }

            isPredicting = true;

            predictButton.textContent =
                "Stop Predicting";

            statusDiv.textContent =
                "AI is running live prediction...";

            showWaitingOverlay();
            runPredictionLoop();
        }


        function stopPrediction(
            showStatus = true
        ) {
            isPredicting = false;

            predictButton.textContent =
                "Start Predicting";

            if (
                predictionFrame !== null
            ) {
                cancelAnimationFrame(
                    predictionFrame
                );

                predictionFrame = null;
            }

            hidePredictionOverlay();

            if (showStatus) {
                statusDiv.textContent =
                    "Prediction stopped.";
            }
        }


        function togglePrediction() {
            if (isPredicting) {
                stopPrediction(true);
            } else {
                startPrediction();
            }
        }


        async function runPredictionLoop() {
            if (!isPredicting) {
                return;
            }

            let activation = null;

            try {
                if (
                    !classifier ||
                    classifier.getNumClasses() === 0
                ) {
                    stopPrediction(false);

                    statusDiv.textContent =
                        "No trained items available.";

                    return;
                }

                if (video.readyState < 2) {
                    predictionFrame =
                        requestAnimationFrame(
                            runPredictionLoop
                        );

                    return;
                }

                activation =
                    mobilenetModel.infer(
                        video,
                        "conv_preds"
                    );

                const result =
                    await classifier.predictClass(
                        activation
                    );

                const predictedClassId =
                    Number(result.label);

                const confidenceValue =
                    Number(
                        result.confidences[
                            result.label
                        ] || 0
                    );

                const confidencePercent =
                    Math.round(
                        confidenceValue * 100
                    );

                const threshold =
                    getConfidenceThreshold();

                const record =
                    classRecords.get(
                        predictedClassId
                    );

                if (
                    confidenceValue < threshold ||
                    !record
                ) {
                    showUnrecognizedOverlay(
                        confidencePercent
                    );
                } else {
                    showRecognizedOverlay(
                        getClassName(
                            predictedClassId
                        ),
                        confidencePercent
                    );
                }
            } catch (error) {
                console.error(
                    "Prediction error:",
                    error
                );

                stopPrediction(false);

                statusDiv.textContent =
                    "Prediction Error: " +
                    error.message;

                return;
            } finally {
                if (activation) {
                    activation.dispose();
                }
            }

            if (isPredicting) {
                predictionFrame =
                    requestAnimationFrame(
                        runPredictionLoop
                    );
            }
        }


        // =====================================================
        // SAVE TRAINING DATA
        // =====================================================

        async function saveTrainingData() {
            if (
                !classifier ||
                classifier.getNumClasses() === 0
            ) {
                alert(
                    "There is no training data to save."
                );

                return;
            }

            stopPrediction(false);

            try {
                statusDiv.textContent =
                    "Preparing training data...";

                const dataset =
                    classifier.getClassifierDataset();

                const serializedDataset = {};

                for (
                    const classId
                    of Object.keys(dataset)
                ) {
                    const tensor =
                        dataset[classId];

                    serializedDataset[classId] = {
                        shape: tensor.shape,
                        values:
                            Array.from(
                                await tensor.data()
                            )
                    };
                }

                const classes =
                    Array.from(
                        classRecords.values()
                    )
                    .filter(function (record) {
                        return record.sampleCount > 0;
                    })
                    .map(function (record) {
                        return {
                            classId:
                                record.classId,

                            name:
                                getClassName(
                                    record.classId
                                ),

                            sampleCount:
                                record.sampleCount
                        };
                    });

                const saveData = {
                    format:
                        "AEYE-KNN-Training",

                    formatVersion:
                        1,

                    tensorflowVersion:
                        tf.version.tfjs,

                    featureModel:
                        "MobileNet conv_preds",

                    confidenceThreshold:
                        Number(
                            thresholdSlider.value
                        ),

                    classes:
                        classes,

                    dataset:
                        serializedDataset
                };

                const jsonText =
                    JSON.stringify(
                        saveData
                    );

                const blob =
                    new Blob(
                        [jsonText],
                        {
                            type:
                                "application/json"
                        }
                    );

                const downloadUrl =
                    URL.createObjectURL(blob);

                const link =
                    document.createElement("a");

                const dateText =
                    new Date()
                        .toISOString()
                        .slice(0, 10);

                link.href =
                    downloadUrl;

                link.download =
                    "AEYE-training-" +
                    dateText +
                    ".json";

                document.body.appendChild(
                    link
                );

                link.click();
                link.remove();

                URL.revokeObjectURL(
                    downloadUrl
                );

                statusDiv.textContent =
                    "Training data saved successfully.";
            } catch (error) {
                console.error(
                    "Save training error:",
                    error
                );

                statusDiv.textContent =
                    "Unable to save training data: " +
                    error.message;
            }
        }


        // =====================================================
        // LOAD TRAINING DATA
        // =====================================================

        function validateTrainingData(data) {
            if (
                !data ||
                typeof data !== "object"
            ) {
                throw new Error(
                    "Invalid training file."
                );
            }

            if (
                data.format !==
                "AEYE-KNN-Training"
            ) {
                throw new Error(
                    "This is not an AEYE training file."
                );
            }

            if (
                !Array.isArray(data.classes)
            ) {
                throw new Error(
                    "The training file has no class list."
                );
            }

            if (
                !data.dataset ||
                typeof data.dataset !== "object"
            ) {
                throw new Error(
                    "The training file has no classifier dataset."
                );
            }
        }


        async function loadTrainingFile(file) {
            if (!file) {
                return;
            }

            stopPrediction(false);

            try {
                statusDiv.textContent =
                    "Loading training data...";

                const jsonText =
                    await file.text();

                const data =
                    JSON.parse(jsonText);

                validateTrainingData(data);

                const restoredDataset = {};

                for (
                    const classId
                    of Object.keys(data.dataset)
                ) {
                    const savedTensor =
                        data.dataset[classId];

                    if (
                        !savedTensor ||
                        !Array.isArray(
                            savedTensor.shape
                        ) ||
                        !Array.isArray(
                            savedTensor.values
                        )
                    ) {
                        throw new Error(
                            "Invalid tensor data for item " +
                            classId +
                            "."
                        );
                    }

                    restoredDataset[classId] =
                        tf.tensor(
                            savedTensor.values,
                            savedTensor.shape,
                            "float32"
                        );
                }

                if (
                    Object.keys(
                        restoredDataset
                    ).length === 0
                ) {
                    throw new Error(
                        "The training file contains no samples."
                    );
                }

                /*
                    Clear the old classifier data before
                    replacing it with the loaded data.
                */
                classifier.clearAllClasses();

                classifier.setClassifierDataset(
                    restoredDataset
                );

                clearClassPanels();

                const sortedClasses =
                    data.classes
                        .slice()
                        .sort(function (a, b) {
                            return (
                                Number(a.classId) -
                                Number(b.classId)
                            );
                        });

                sortedClasses.forEach(
                    function (savedClass) {
                        const classId =
                            Number(
                                savedClass.classId
                            );

                        const datasetEntry =
                            restoredDataset[
                                String(classId)
                            ];

                        let sampleCount =
                            Number(
                                savedClass.sampleCount
                            ) || 0;

                        /*
                            The first tensor dimension is
                            normally the number of samples.
                        */
                        if (
                            datasetEntry &&
                            datasetEntry.shape.length > 0
                        ) {
                            sampleCount =
                                datasetEntry.shape[0];
                        }

                        createClassPanel(
                            classId,
                            savedClass.name ||
                                getDefaultClassName(
                                    classId
                                ),
                            sampleCount
                        );
                    }
                );

                /*
                    Handle any dataset class that may be
                    missing from the class information.
                */
                Object.keys(
                    restoredDataset
                ).forEach(function (classIdText) {
                    const classId =
                        Number(classIdText);

                    if (
                        !classRecords.has(classId)
                    ) {
                        const tensor =
                            restoredDataset[
                                classIdText
                            ];

                        createClassPanel(
                            classId,
                            getDefaultClassName(
                                classId
                            ),
                            tensor.shape[0] || 0
                        );
                    }
                });

                ensureEmptyClassExists();

                const savedThreshold =
                    Number(
                        data.confidenceThreshold
                    );

                if (
                    Number.isFinite(
                        savedThreshold
                    )
                ) {
                    const safeThreshold =
                        Math.min(
                            99,
                            Math.max(
                                50,
                                savedThreshold
                            )
                        );

                    thresholdSlider.value =
                        String(safeThreshold);

                    thresholdValue.textContent =
                        safeThreshold + "%";
                }

                enableControls();
                updateSaveButton();

                statusDiv.textContent =
                    "Training data loaded. " +
                    classifier.getNumClasses() +
                    " trained item class(es) ready.";

                hidePredictionOverlay();
            } catch (error) {
                console.error(
                    "Load training error:",
                    error
                );

                statusDiv.textContent =
                    "Unable to load training data: " +
                    error.message;
            } finally {
                /*
                    Clear the file selection so that the
                    same file can be selected again.
                */
                trainingFileInput.value = "";
            }
        }


        // =====================================================
        // RESET
        // =====================================================

        function resetAll() {
            stopPrediction(false);

            if (classifier) {
                classifier.clearAllClasses();
            }

            clearClassPanels();
            createClassPanel();

            enableControls();
            updateSaveButton();
            hidePredictionOverlay();

            statusDiv.textContent =
                "All training samples cleared.";
        }


        // =====================================================
        // INITIALIZATION
        // =====================================================

        async function initializeApp() {
            try {
                statusDiv.textContent =
                    "Checking AI libraries...";

                checkLibraries();

                statusDiv.textContent =
                    "Preparing TensorFlow...";

                await tf.ready();

                console.log(
                    "TensorFlow backend:",
                    tf.getBackend()
                );

                classifier =
                    knnClassifier.create();

                statusDiv.textContent =
                    "Loading MobileNet model...";

                mobilenetModel =
                    await mobilenet.load();

                statusDiv.textContent =
                    "Requesting camera permission...";

                await setupCamera();

                enableControls();

                statusDiv.textContent =
                    "Ready! Train a new item or load saved training data.";
            } catch (error) {
                console.error(
                    "Initialization error:",
                    error
                );

                statusDiv.textContent =
                    "Initialization Error: " +
                    error.message;
            }
        }


        // =====================================================
        // EVENTS
        // =====================================================

        addClassButton.addEventListener(
            "click",
            function () {
                const newRecord =
                    createClassPanel();

                newRecord.input.focus();

                statusDiv.textContent =
                    "New training item added.";
            }
        );


        toggleCameraButton.addEventListener(
            "click",
            switchCamera
        );


        predictButton.addEventListener(
            "click",
            togglePrediction
        );


        resetButton.addEventListener(
            "click",
            resetAll
        );


        saveTrainingButton.addEventListener(
            "click",
            saveTrainingData
        );


        loadTrainingButton.addEventListener(
            "click",
            function () {
                trainingFileInput.click();
            }
        );


        trainingFileInput.addEventListener(
            "change",
            function () {
                const selectedFile =
                    trainingFileInput.files[0];

                loadTrainingFile(
                    selectedFile
                );
            }
        );


        window.addEventListener(
            "load",
            function () {
                createClassPanel();
                initializeApp();
            }
        );


        window.addEventListener(
            "beforeunload",
            function () {
                stopPrediction(false);
                stopCurrentCamera();

                if (classifier) {
                    classifier.clearAllClasses();
                }
            }
        );
    </script>

</body>
</html>
